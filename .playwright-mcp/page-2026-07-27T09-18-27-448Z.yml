        - paragraph [ref=e787]: "**核心判读** - 问界在抖音平台近 32 天累计声量 1.67 万篇、总互动近 297 万次，情感指数 0.71、同比 +13.72%、环比 +16.14%，品牌声量质量处于持续向上通道。 - 内容高度聚焦「汽车」垂类（声量 7,486，占内容主题绝对主导），讨论围绕 M9 / M8 / M7 三款主力车型展开，合计话题声量超 1.4 万，构成本周期声量的核心引擎。 - 「#我与问界的百万之约#」（366）与「#问界第100万辆整车下线#」（118）等里程碑话题形成跨周期长尾内容，结合 1 月 10 日（701）与 1 月 13 日（754）声量峰值，验证大型营销节点的显著放大效应。 - 负面声量 462 条、占比 2.8%，负面互动 8.43 万次（互动占比 2.8%），与正面 79.69 万次互动（26.9%）形成明显梯度，整体舆情风险可控。 **可执行建议** 1. **借势百万里程碑做长尾传播**：围绕「百万之约」主题继续投放车主故事 UGC，将 1 月初已释放的情绪势能延续至春节档期，匹配 M8 / M9 主力车型节奏。 2. **强化 M8 产品声量追赶**：M8 话题声量 2,692+811≈3,503，落后 M9（≈9,426）和 M7（≈4,903），建议针对性补足产品力、技术点（如智驾、AEB、冬测）的内容缺口。 3. **建立负面舆情 SLA**：2.8% 负面声量虽不高，但 2.8% 的负面互动占比与声量占比基本同步，提示需对交付、售后、智驾相关议题设置 4 小时内响应机制。 4. **撬动老车主生态**：「问界改装 / 升级 / 配件」相关话题累计声量超 1,300，可通过官方改装认证、地区性改装活动（武汉、郑州、西安等已涌现城市话题）撬动复购与转介绍。 5. **下一步数据补强**：本期证据仅覆盖抖音单一平台，且未提供竞品对比基线，建议追加微博 / 小红书 / 知乎等多平台数据，并加入主要竞品（理想、蔚来、小米汽车等）口径，方可形成完整竞争坐标。"
