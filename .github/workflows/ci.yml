name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      APP_ENV: test
      AUTH_MODE: mock
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: kol_insight_test
      MYSQL_USER: kol_test
      MYSQL_PASSWORD: test-only-password
      JWT_SECRET: test-only-jwt-secret-at-least-32-characters
      TENCENT_PLAN_API_KEY: test-only-model-key
      DATATAP_MCP_TOKEN: test-only-datatap-token
      GOAL_PLANNER_ENFORCE_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Create test database user
        run: |
          mysql --protocol=tcp --host=127.0.0.1 --user=root --password=ci-root-password <<'SQL'
          CREATE DATABASE IF NOT EXISTS kol_insight_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          CREATE USER IF NOT EXISTS 'kol_test'@'%' IDENTIFIED BY 'test-only-password';
          GRANT ALL PRIVILEGES ON kol_insight_test.* TO 'kol_test'@'%';
          FLUSH PRIVILEGES;
          SQL

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Ruff
        working-directory: backend
        run: ruff check app tests

      - name: Pytest
        working-directory: backend
        run: pytest -q

  node-workspaces:
    name: Node workspaces
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Pi Runtime
            directory: pi-runtime
            test: npm test
            typecheck: npm run typecheck
            build: ""
          - name: Pi Gateway
            directory: pi-gateway
            test: npm test
            typecheck: npm run typecheck
            build: npm run build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: npm ci

      - name: Test
        working-directory: ${{ matrix.directory }}
        run: ${{ matrix.test }}

      - name: Typecheck
        working-directory: ${{ matrix.directory }}
        run: ${{ matrix.typecheck }}

      - name: Build
        if: ${{ matrix.build != '' }}
        working-directory: ${{ matrix.directory }}
        run: ${{ matrix.build }}

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Vitest
        run: npm run test

      - name: Typecheck
        run: npm run lint

      - name: Production build
        run: npm run build
