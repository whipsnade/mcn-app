[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kol-insight-api"
version = "0.1.0"
description = "KOL Insight modular monolith API"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "asyncmy>=0.2,<1",
  "cryptography>=44,<47",
  "fastapi>=0.115,<1",
  "greenlet>=3.1,<4",
  "httpx>=0.28,<1",
  "json-repair>=0.30,<1",
  "jsonschema>=4.23,<5",
  "mcp>=1.27,<2",
  "openai>=1,<2",
  "openpyxl>=3.1,<4",
  "prometheus-client>=0.21,<1",
  "pydantic-settings>=2.7,<3",
  "PyJWT>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 真实服务 UAT 标记：只有显式 ``-m real_services`` 且脚本设置 ``RUN_REAL_SERVICES=1``
# 才会运行 tests/integration/test_agent_runtime_real.py（真实模型 + 真实 DataTap MCP）。
markers = [
  "real_services: 真实模型 + 真实 DataTap MCP UAT（默认跳过，RUN_REAL_SERVICES=1 启用）",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["app*"]
